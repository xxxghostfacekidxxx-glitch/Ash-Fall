name: Summarize new issues

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  summary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run AI inference
        id: inference
        uses: actions/ai-inference@v1
        with:
          prompt: |
            Summarize the following GitHub issue in one concise paragraph:
            Title: ${{ github.event.issue.title }}
            Body: ${{ github.event.issue.body }}

      - name: Comment with AI summary (Markdown formatted & trimmed)
        uses: actions/github-script@v7
        with:
          script: |
            // Parse AI output safely
            let summary = JSON.parse('${{ toJson(steps.inference.outputs.response) }}');

            // Trim to 400 characters
            if (summary.length > 400) {
              summary = summary.slice(0, 400);
              const lastSpace = summary.lastIndexOf(' ');
              if (lastSpace > 0) summary = summary.slice(0, lastSpace) + '...';
              else summary += '...';
            }

            // Build Markdown comment
            const body = `**Issue Title:** ${context.payload.issue.title}\n\n> ${summary}`;

            await github.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });