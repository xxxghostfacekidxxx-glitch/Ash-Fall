name: Cloudflare Worker Deploy

on:push branches:
      - main-*     
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            wrangler deploy
          else
            wrangler deploy --env preview
          fi
   runs-on: ubuntu-latest
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install npm dependencies
        run: npm install

      # 4️⃣ Build Worker + copy static assets
      - name: Build Worker 
        run: npm run build

      # 5️⃣ Install Wrangler CLI
      - name: Install Wrangler
        run: npm install -g wrangler@4.59.3

      # 6️⃣ Deploy
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            wrangler deploy
          else
            wrangler deploy --env preview
          fi
