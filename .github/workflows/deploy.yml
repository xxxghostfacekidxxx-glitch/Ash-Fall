name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main  # only deploy when main branch is updated

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3. Install Wrangler globally
      - name: Install Wrangler
        run: npm install -g wrangler@4.59.3

      # 4. Deploy to Cloudflare Worker
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.2835905}}  # store your API token in GitHub Secrets
        run: |
  if [ "${{ github.ref_name }}" = "main" ]; then
    wrangler deploy
  else
    wrangler deploy --env preview
  fi