# -------------------------------
# Ash-Fall / Miss Chaos Config
# -------------------------------

# Worker config
name = "miss-chaos-backend"
main = "dist/index.js"          # compiled Worker entrypoint
type = "module"
compatibility_date = "2026-01-18"

[build]
command = "npm run build"       # builds Worker and static site
upload_format = "service-worker"

[[kv_namespaces]]
binding = "MEMORY"
id = "2eb4c3875662467b8f89d537bcd74535"

# Pages config
[site]
bucket = "./dist"               # folder with static HTML/CSS/JS
entry-point = "workers-site"   # standard Cloudflare Pages workers entry

[build]
pages_build_output_dir = "./dist"  # Pages needs this to find static assets
