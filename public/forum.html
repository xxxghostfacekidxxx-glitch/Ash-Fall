<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ash-Fall Forum</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 2em;
            background: linear-gradient(45deg, #ff6b6b, #ee5a6f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .user-section {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            background: linear-gradient(45deg, #ee5a6f, #f29263);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            border: 2px solid #ee5a6f;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #ee5a6f;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 14px;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .thread-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .thread-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.3s;
        }

        .thread-card:hover {
            border-color: #ee5a6f;
            transform: translateY(-2px);
        }

        .thread-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .thread-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #fff;
        }

        .thread-meta {
            display: flex;
            gap: 15px;
            font-size: 0.85em;
            color: #999;
        }

        .thread-content {
            color: #ccc;
            margin-top: 10px;
            line-height: 1.6;
        }

        .replies-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .reply-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 3px solid #ee5a6f;
        }

        .reply-author {
            font-weight: 600;
            color: #ee5a6f;
            margin-bottom: 5px;
        }

        .reply-content {
            color: #ccc;
            line-height: 1.5;
        }

        .vote-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .vote-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            padding: 5px 12px;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        .vote-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .vote-count {
            font-weight: 600;
            color: #ee5a6f;
        }

        .back-btn {
            margin-bottom: 20px;
        }

        .error {
            color: #ff6b6b;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .success {
            color: #51cf66;
            font-size: 0.9em;
            margin-top: 5px;
        }

        #threadView {
            display: none;
        }

        .close-modal {
            float: right;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .close-modal:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔥 Ash-Fall Forum</h1>
            <div class="user-section">
                <span id="userDisplay">Guest</span>
                <button class="btn" id="loginBtn">Login</button>
                <button class="btn btn-secondary" id="signupBtn">Sign Up</button>
                <button class="btn" id="logoutBtn" style="display: none;">Logout</button>
            </div>
        </header>

        <!-- Thread List View -->
        <div id="threadList">
            <button class="btn" id="newThreadBtn" style="margin-bottom: 20px;">+ New Thread</button>
            <div class="thread-list" id="threads"></div>
        </div>

        <!-- Single Thread View -->
        <div id="threadView">
            <button class="btn back-btn" id="backBtn">← Back to Forum</button>
            <div id="threadDetail"></div>
            <div class="replies-section">
                <h3>Replies</h3>
                <div id="replies"></div>
                <div style="margin-top: 20px;">
                    <textarea id="replyInput" placeholder="Write a reply..." style="width: 100%; padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.05); color: white; border: 1px solid #444; min-height: 80px;"></textarea>
                    <button class="btn" id="submitReply" style="margin-top: 10px;">Post Reply</button>
                </div>
            </div>
        </div>

        <!-- Login Modal -->
        <div id="loginModal" class="modal">
            <div class="modal-content">
                <span class="close-modal" onclick="closeModal('loginModal')">&times;</span>
                <h2>Login</h2>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password">
                </div>
                <div id="loginError" class="error"></div>
                <button class="btn" onclick="login()">Login</button>
            </div>
        </div>

        <!-- Signup Modal -->
        <div id="signupModal" class="modal">
            <div class="modal-content">
                <span class="close-modal" onclick="closeModal('signupModal')">&times;</span>
                <h2>Sign Up</h2>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="signupUsername" placeholder="Choose username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" placeholder="Choose password">
                </div>
                <div class="form-group">
                    <label>Email (optional)</label>
                    <input type="email" id="signupEmail" placeholder="your@email.com">
                </div>
                <div id="signupError" class="error"></div>
                <div id="signupSuccess" class="success"></div>
                <button class="btn" onclick="signup()">Create Account</button>
            </div>
        </div>

        <!-- New Thread Modal -->
        <div id="newThreadModal" class="modal">
            <div class="modal-content">
                <span class="close-modal" onclick="closeModal('newThreadModal')">&times;</span>
                <h2>Create New Thread</h2>
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="threadTitle" placeholder="Thread title">
                </div>
                <div class="form-group">
                    <label>Content</label>
                    <textarea id="threadContent" placeholder="What's on your mind?"></textarea>
                </div>
                <div id="threadError" class="error"></div>
                <button class="btn" onclick="createThread()">Post Thread</button>
            </div>
        </div>
    </div>

    <script>
        // API Base URL - UPDATE THIS to your Cloudflare Worker URL
        const API_URL = '/api'; // or 'https://your-worker.workers.dev'

        let currentUser = null;
        let currentThreadId = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadThreads();

            document.getElementById('loginBtn').addEventListener('click', () => openModal('loginModal'));
            document.getElementById('signupBtn').addEventListener('click', () => openModal('signupModal'));
            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('newThreadBtn').addEventListener('click', () => {
                if (!currentUser) {
                    alert('Please login to create a thread');
                    return;
                }
                openModal('newThreadModal');
            });
            document.getElementById('backBtn').addEventListener('click', () => {
                document.getElementById('threadView').style.display = 'none';
                document.getElementById('threadList').style.display = 'block';
            });
            document.getElementById('submitReply').addEventListener('click', postReply);
        });

        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function checkAuth() {
            const user = localStorage.getItem('forumUser');
            const token = localStorage.getItem('forumToken');
            if (user && token) {
                currentUser = JSON.parse(user);
                updateAuthUI();
            }
        }

        function updateAuthUI() {
            if (currentUser) {
                document.getElementById('userDisplay').textContent = currentUser.username;
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('signupBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'block';
            } else {
                document.getElementById('userDisplay').textContent = 'Guest';
                document.getElementById('loginBtn').style.display = 'block';
                document.getElementById('signupBtn').style.display = 'block';
                document.getElementById('logoutBtn').style.display = 'none';
            }
        }

        async function signup() {
            const username = document.getElementById('signupUsername').value;
            const password = document.getElementById('signupPassword').value;
            const email = document.getElementById('signupEmail').value;

            if (!username || !password) {
                document.getElementById('signupError').textContent = 'Username and password required';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, email })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('signupSuccess').textContent = 'Account created! Please login.';
                    document.getElementById('signupError').textContent = '';
                    setTimeout(() => {
                        closeModal('signupModal');
                        openModal('loginModal');
                    }, 1500);
                } else {
                    document.getElementById('signupError').textContent = data.error || 'Signup failed';
                }
            } catch (err) {
                document.getElementById('signupError').textContent = 'Network error';
            }
        }

        async function login() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    currentUser = data.user;
                    localStorage.setItem('forumUser', JSON.stringify(data.user));
                    localStorage.setItem('forumToken', data.token);
                    updateAuthUI();
                    closeModal('loginModal');
                } else {
                    document.getElementById('loginError').textContent = data.error || 'Login failed';
                }
            } catch (err) {
                document.getElementById('loginError').textContent = 'Network error';
            }
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('forumUser');
            localStorage.removeItem('forumToken');
            updateAuthUI();
        }

        async function loadThreads() {
            try {
                const response = await fetch(`${API_URL}/threads`);
                const threads = await response.json();

                const threadList = document.getElementById('threads');
                threadList.innerHTML = threads.map(thread => `
                    <div class="thread-card" onclick="viewThread('${thread.id}')">
                        <div class="thread-header">
                            <div>
                                <div class="thread-title">${thread.title}</div>
                                <div class="thread-meta">
                                    <span>👤 ${thread.author}</span>
                                    <span>💬 ${thread.replyCount || 0} replies</span>
                                    <span>⬆️ ${thread.votes || 0}</span>
                                    <span>${new Date(thread.createdAt).toLocaleDateString()}</span>
                                </div>
                            </div>
                        </div>
                        <div class="thread-content">${thread.content.substring(0, 200)}${thread.content.length > 200 ? '...' : ''}</div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Failed to load threads:', err);
            }
        }

        async function createThread() {
            if (!currentUser) return;

            const title = document.getElementById('threadTitle').value;
            const content = document.getElementById('threadContent').value;

            if (!title || !content) {
                document.getElementById('threadError').textContent = 'Title and content required';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/threads`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('forumToken')}`
                    },
                    body: JSON.stringify({ title, content })
                });

                if (response.ok) {
                    closeModal('newThreadModal');
                    document.getElementById('threadTitle').value = '';
                    document.getElementById('threadContent').value = '';
                    loadThreads();
                } else {
                    const data = await response.json();
                    document.getElementById('threadError').textContent = data.error || 'Failed to create thread';
                }
            } catch (err) {
                document.getElementById('threadError').textContent = 'Network error';
            }
        }

        async function viewThread(threadId) {
            currentThreadId = threadId;

            try {
                const response = await fetch(`${API_URL}/threads/${threadId}`);
                const thread = await response.json();

                document.getElementById('threadDetail').innerHTML = `
                    <div class="thread-card">
                        <div class="thread-title">${thread.title}</div>
                        <div class="thread-meta">
                            <span>👤 ${thread.author}</span>
                            <span>${new Date(thread.createdAt).toLocaleDateString()}</span>
                        </div>
                        <div class="thread-content" style="margin-top: 15px;">${thread.content}</div>
                        <div class="vote-buttons" style="margin-top: 15px;">
                            <button class="vote-btn" onclick="vote('${threadId}', 1)">⬆️</button>
                            <span class="vote-count">${thread.votes || 0}</span>
                            <button class="vote-btn" onclick="vote('${threadId}', -1)">⬇️</button>
                        </div>
                    </div>
                `;

                const replies = thread.replies || [];
                document.getElementById('replies').innerHTML = replies.map(reply => `
                    <div class="reply-card">
                        <div class="reply-author">${reply.author}</div>
                        <div class="reply-content">${reply.content}</div>
                        <div style="font-size: 0.8em; color: #999; margin-top: 5px;">
                            ${new Date(reply.createdAt).toLocaleDateString()}
                        </div>
                    </div>
                `).join('') || '<p style="color: #999;">No replies yet. Be the first!</p>';

                document.getElementById('threadList').style.display = 'none';
                document.getElementById('threadView').style.display = 'block';
            } catch (err) {
                console.error('Failed to load thread:', err);
            }
        }

        async function postReply() {
            if (!currentUser) {
                alert('Please login to reply');
                return;
            }

            const content = document.getElementById('replyInput').value;
            if (!content) return;

            try {
                const response = await fetch(`${API_URL}/threads/${currentThreadId}/replies`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('forumToken')}`
                    },
                    body: JSON.stringify({ content })
                });

                if (response.ok) {
                    document.getElementById('replyInput').value = '';
                    viewThread(currentThreadId);
                }
            } catch (err) {
                console.error('Failed to post reply:', err);
            }
        }

        async function vote(threadId, direction) {
            if (!currentUser) {
                alert('Please login to vote');
                return;
            }

            try {
                await fetch(`${API_URL}/threads/${threadId}/vote`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('forumToken')}`
                    },
                    body: JSON.stringify({ direction })
                });

                viewThread(threadId);
            } catch (err) {
                console.error('Failed to vote:', err);
            }
        }
    </script>
</body>
</html>
